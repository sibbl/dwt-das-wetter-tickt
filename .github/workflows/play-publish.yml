name: Publish Google Play release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag containing the signed AAB
        required: true
        type: string
      track:
        description: Google Play Wear OS track
        required: true
        default: wear:internal
        type: choice
        options:
          - wear:internal
          - wear:alpha
          - wear:beta
          - wear:production
      status:
        description: Google Play release status
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.PLAY_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      PLAY_TRACK: ${{ github.event_name == 'workflow_dispatch' && inputs.track || 'wear:production' }}
      PLAY_STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.status || 'completed' }}

    steps:
      - name: Download signed AAB from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-artifacts
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern 'dwt-das-wetter-tickt-*.aab' \
            --dir release-artifacts

      - name: Upload release to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.sibbl.dwt
          releaseFiles: release-artifacts/*.aab
          track: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_STATUS }}
